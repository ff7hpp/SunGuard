<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121415">
  <title>SunGuard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ed9a71'/%3E%3Ccircle cx='16' cy='16' r='5' fill='none' stroke='%23141617' stroke-width='2'/%3E%3Cpath d='M16 5v3m0 16v3M5 16h3m16 0h3M8 8l2 2m12 12 2 2M8 24l2-2m12-12 2-2' stroke='%23141617' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
  <script defer src="./build/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to dashboard</a>
  <aside class="sidebar">
    <div class="brand"><span class="brand-icon" data-icon="sun"></span><span>SunGuard</span></div>
    <nav aria-label="Workspace">
      <button data-page="overview" aria-current="page"><span data-icon="grid"></span>Overview</button>
      <button data-page="analytics"><span data-icon="chart"></span>Analytics</button>
      <button data-page="alerts"><span data-icon="bell"></span>Alerts <b id="nav-alerts">7</b></button>
      <button data-page="activity"><span data-icon="list"></span>Activity log</button>
    </nav>
  </aside>
  <main id="main">
    <div class="topbar">
      <div class="top-actions">
        <div class="theme-switcher" role="group" aria-label="Color theme">
          <button data-theme="dark" aria-pressed="true">Dark</button>
          <button data-theme="calm" aria-pressed="false">Calm</button>
          <button data-theme="light" aria-pressed="false">Light</button>
        </div>
      </div>
    </div>
    <div id="primary">
      <div id="map-replay-controls" class="scenario-controls" hidden><strong>Recorded replay</strong><button data-replay-play="true">Play</button><button data-replay-pause="true">Pause</button><button data-replay-latest="true">Latest sample</button><span id="map-replay-status" role="status"></span></div>
      <header class="intro">
        <h1 id="title" tabindex="-1">Farm overview</h1>
        <div class="snapshot"><span data-icon="clock"></span><div><small>DISPLAYED TIME</small><strong>14:32 <em>UTC</em></strong></div></div>
      </header>
      <section class="viewer" aria-label="Solar map">
        <header class="viewer-head">
          <div class="segmented" aria-label="Camera views">
            <button id="perspective" aria-pressed="true"><span data-icon="cube"></span>Orbit view</button>
            <button id="top" aria-pressed="false"><span data-icon="top"></span>Top view</button>
            <button id="grid" aria-pressed="false"><span data-icon="grid"></span>2D</button>
          </div>
        </header>
        <div id="stage" class="stage">
          <div id="canvas-host" aria-hidden="true"></div>
          <div id="flat-map" hidden aria-label="Interactive 2D panel map"></div>
        </div>
        <div class="stage-tools">
          <button id="zoom-in" aria-label="Zoom in" title="Zoom in">+</button>
          <button id="zoom-out" aria-label="Zoom out" title="Zoom out">−</button>
          <button id="reset" aria-label="Reset camera" title="Reset camera"><span data-icon="reset"></span></button>
        </div>
        <button id="hotspot" class="hotspot" data-panel="62"><span>◆</span><div><small>NEEDS ATTENTION</small><strong>R05-C03</strong></div><span data-icon="arrow"></span></button>
        <footer class="viewer-foot"><div id="legend"></div><span id="camera-hint">Drag to orbit · right-drag to pan · scroll to zoom</span></footer>
      </section>
      <section id="metrics" class="metrics" aria-label="Farm readings"></section>
      <section id="overview-alerts" class="paper alert-section"></section>
    </div>
    <section id="subpage" hidden></section>
  </main>
  <dialog id="panel-dialog" aria-labelledby="panel-title">
    <div class="dialog-head"><div><p class="eyebrow">MODULE INSPECTOR</p><h2 id="panel-title"></h2></div><button id="close-panel" aria-label="Close panel details">×</button></div>
    <div id="panel-content"></div>
  </dialog>
  <noscript>SunGuard requires JavaScript.</noscript>
</body>
</html>
